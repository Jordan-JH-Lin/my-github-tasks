<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My GitHub Tasks</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e5;
    --accent: #2563eb;
    --chip-bg: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --card-bg: #1c1c1f;
      --text: #ececec;
      --muted: #9a9a9a;
      --border: #2e2e33;
      --accent: #6d94ff;
      --chip-bg: #232a44;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px clamp(16px, 4vw, 48px) 8px;
  }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .meta { color: var(--muted); font-size: 0.85rem; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px clamp(16px, 4vw, 48px);
    align-items: flex-start;
  }
  select, input[type="text"] {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.9rem;
  }
  .multiselect { position: relative; }
  .ms-button {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    min-width: 160px;
    text-align: left;
  }
  .ms-button:hover { border-color: var(--accent); }
  .ms-panel {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 20;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    min-width: 240px;
    max-height: 320px;
    overflow-y: auto;
    padding: 8px;
  }
  .ms-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .ms-actions button {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 0.8rem;
    padding: 2px 4px;
  }
  .ms-actions button:hover { text-decoration: underline; }
  .ms-option {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px;
    font-size: 0.85rem;
    cursor: pointer;
    border-radius: 4px;
  }
  .ms-option:hover { background: var(--chip-bg); }
  .ms-option input { cursor: pointer; }
  main {
    padding: 0 clamp(16px, 4vw, 48px) 48px;
    max-width: 1100px;
  }
  .org-block { margin-bottom: 28px; }
  .org-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 8px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--border);
  }
  .project-block { margin: 12px 0 0 4px; }
  .project-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 6px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 0.88rem;
  }
  th, td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  tr:last-child td { border-bottom: none; }
  th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .status-chip {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--accent);
    font-size: 0.78rem;
    white-space: nowrap;
  }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .overflow-wrap { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>My GitHub Tasks</h1>
  <div class="meta" id="meta">Loading...</div>
</header>
<div class="controls">
  <div class="multiselect" id="assignee-ms">
    <button type="button" class="ms-button" id="assignee-ms-btn">Assignee: All</button>
    <div class="ms-panel" id="assignee-ms-panel" hidden>
      <div class="ms-actions">
        <button type="button" data-action="all">全選</button>
        <button type="button" data-action="none">全不選</button>
      </div>
      <div class="ms-options" id="assignee-ms-options"></div>
    </div>
  </div>

  <div class="multiselect" id="status-ms">
    <button type="button" class="ms-button" id="status-ms-btn">Status: All</button>
    <div class="ms-panel" id="status-ms-panel" hidden>
      <div class="ms-actions">
        <button type="button" data-action="all">全選</button>
        <button type="button" data-action="none">全不選</button>
      </div>
      <div class="ms-options" id="status-ms-options"></div>
    </div>
  </div>

  <label for="state-select">State:</label>
  <select id="state-select">
    <option value="ALL">All</option>
    <option value="OPEN" selected>Open</option>
    <option value="CLOSED">Closed</option>
  </select>
  <input type="text" id="search-box" placeholder="Filter by title / repo..." />
</div>
<main id="main">
  <div class="empty">Loading data.json...</div>
</main>

<script>
let DATA = null;
let selectedLogins = new Set();
let selectedStatuses = new Set();
let openPanels = [];

const NO_STATUS_LABEL = "(no status)";

function closeAllPanels() {
  for (const p of openPanels) p.hidden = true;
}

function setupMultiSelect({ btnId, panelId, optionsId, items, selected, label }) {
  const btn = document.getElementById(btnId);
  const panel = document.getElementById(panelId);
  const optionsEl = document.getElementById(optionsId);

  function updateButtonLabel() {
    if (items.length === 0) {
      btn.textContent = `${label}: (none)`;
    } else if (selected.size === items.length) {
      btn.textContent = `${label}: All`;
    } else if (selected.size === 0) {
      btn.textContent = `${label}: None`;
    } else {
      btn.textContent = `${label}: ${selected.size}/${items.length}`;
    }
  }

  optionsEl.innerHTML = "";
  for (const item of items) {
    const optLabel = document.createElement("label");
    optLabel.className = "ms-option";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selected.has(item.key);
    cb.addEventListener("change", () => {
      if (cb.checked) selected.add(item.key);
      else selected.delete(item.key);
      updateButtonLabel();
      render();
    });
    const span = document.createElement("span");
    span.textContent = item.label;
    optLabel.appendChild(cb);
    optLabel.appendChild(span);
    optionsEl.appendChild(optLabel);
  }

  panel.querySelector('[data-action="all"]').addEventListener("click", () => {
    selected.clear();
    for (const item of items) selected.add(item.key);
    for (const cb of optionsEl.querySelectorAll("input")) cb.checked = true;
    updateButtonLabel();
    render();
  });
  panel.querySelector('[data-action="none"]').addEventListener("click", () => {
    selected.clear();
    for (const cb of optionsEl.querySelectorAll("input")) cb.checked = false;
    updateButtonLabel();
    render();
  });

  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isHidden = panel.hidden;
    closeAllPanels();
    panel.hidden = !isHidden;
  });
  panel.addEventListener("click", (e) => e.stopPropagation());

  updateButtonLabel();
  openPanels.push(panel);
}

function groupByOrgProject(items) {
  const orgs = new Map();
  for (const item of items) {
    const orgKey = item.org || "(unknown org)";
    if (!orgs.has(orgKey)) orgs.set(orgKey, new Map());
    const projMap = orgs.get(orgKey);
    const projKey = item.project || "(no project)";
    if (!projMap.has(projKey)) projMap.set(projKey, { url: item.projectUrl, items: [] });
    projMap.get(projKey).items.push(item);
  }
  return orgs;
}

function getFilteredItems() {
  const stateFilter = document.getElementById("state-select").value;
  const search = document.getElementById("search-box").value.trim().toLowerCase();

  let items = [];
  for (const user of DATA.users) {
    if (!selectedLogins.has(user.login)) continue;
    for (const item of user.items || []) {
      items.push({ ...item, assigneeLogin: user.login, assigneeName: user.name });
    }
  }

  if (stateFilter !== "ALL") items = items.filter((i) => i.state === stateFilter);

  items = items.filter((i) => selectedStatuses.has(i.status || NO_STATUS_LABEL));

  if (search) {
    items = items.filter(
      (i) =>
        i.title.toLowerCase().includes(search) ||
        (i.repo || "").toLowerCase().includes(search)
    );
  }

  return items;
}

function render() {
  const main = document.getElementById("main");
  main.innerHTML = "";

  if (selectedLogins.size === 0) {
    main.innerHTML = '<div class="empty">請至少選擇一位 Assignee。</div>';
    return;
  }
  if (selectedStatuses.size === 0) {
    main.innerHTML = '<div class="empty">請至少選擇一個 Status。</div>';
    return;
  }

  const items = getFilteredItems();

  if (items.length === 0) {
    main.innerHTML = '<div class="empty">沒有符合條件的任務。</div>';
    return;
  }

  const orgs = groupByOrgProject(items);
  const sortedOrgs = Array.from(orgs.keys()).sort();

  for (const orgKey of sortedOrgs) {
    const orgBlock = document.createElement("div");
    orgBlock.className = "org-block";
    const orgTitle = document.createElement("div");
    orgTitle.className = "org-title";
    orgTitle.textContent = orgKey;
    orgBlock.appendChild(orgTitle);

    const projMap = orgs.get(orgKey);
    const sortedProjects = Array.from(projMap.keys()).sort();
    for (const projKey of sortedProjects) {
      const proj = projMap.get(projKey);
      const projBlock = document.createElement("div");
      projBlock.className = "project-block";
      const projTitle = document.createElement("div");
      projTitle.className = "project-title";
      if (proj.url) {
        const a = document.createElement("a");
        a.href = proj.url;
        a.target = "_blank";
        a.textContent = projKey;
        projTitle.appendChild(a);
      } else {
        projTitle.textContent = projKey;
      }
      projBlock.appendChild(projTitle);

      const wrap = document.createElement("div");
      wrap.className = "overflow-wrap";
      const table = document.createElement("table");
      table.innerHTML = `
        <thead><tr><th>#</th><th>Title</th><th>Repo</th><th>Assignee</th><th>State</th><th>Status</th></tr></thead>
      `;
      const tbody = document.createElement("tbody");
      const sortedItems = proj.items.sort(
        (a, b) => a.assigneeLogin.localeCompare(b.assigneeLogin) || a.number - b.number
      );
      for (const item of sortedItems) {
        const assigneeLabel = item.assigneeName
          ? `${item.assigneeName} (${item.assigneeLogin})`
          : item.assigneeLogin;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>#${item.number}</td>
          <td><a href="${item.url}" target="_blank">${escapeHtml(item.title)}</a></td>
          <td>${escapeHtml(item.repo || "")}</td>
          <td>${escapeHtml(assigneeLabel)}</td>
          <td>${item.state}</td>
          <td>${item.status ? `<span class="status-chip">${escapeHtml(item.status)}</span>` : ""}</td>
        `;
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      wrap.appendChild(table);
      projBlock.appendChild(wrap);
      orgBlock.appendChild(projBlock);
    }
    main.appendChild(orgBlock);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

async function init() {
  try {
    const res = await fetch("data.json", { cache: "no-store" });
    DATA = await res.json();
  } catch (e) {
    document.getElementById("main").innerHTML =
      '<div class="empty">無法載入 data.json，請確認排程是否已成功執行一次。</div>';
    return;
  }

  document.getElementById("meta").textContent =
    `Last updated: ${new Date(DATA.generatedAt).toLocaleString()} · ${DATA.orgs.length} orgs · ${DATA.users.length} people`;

  if (!DATA.users || DATA.users.length === 0) {
    document.getElementById("main").innerHTML =
      '<div class="empty">尚無資料，排程執行後會自動出現。</div>';
    return;
  }

  const sortedUsers = [...DATA.users].sort((a, b) => a.login.localeCompare(b.login));
  selectedLogins = new Set(sortedUsers.map((u) => u.login));

  const statusSet = new Set();
  let hasNoStatus = false;
  for (const u of DATA.users) {
    for (const item of u.items || []) {
      if (item.status) statusSet.add(item.status);
      else hasNoStatus = true;
    }
  }
  const sortedStatuses = Array.from(statusSet).sort();
  if (hasNoStatus) sortedStatuses.push(NO_STATUS_LABEL);
  selectedStatuses = new Set(sortedStatuses);

  setupMultiSelect({
    btnId: "assignee-ms-btn",
    panelId: "assignee-ms-panel",
    optionsId: "assignee-ms-options",
    items: sortedUsers.map((u) => ({
      key: u.login,
      label: u.name ? `${u.name} (${u.login})` : u.login,
    })),
    selected: selectedLogins,
    label: "Assignee",
  });

  setupMultiSelect({
    btnId: "status-ms-btn",
    panelId: "status-ms-panel",
    optionsId: "status-ms-options",
    items: sortedStatuses.map((s) => ({ key: s, label: s })),
    selected: selectedStatuses,
    label: "Status",
  });

  document.getElementById("state-select").addEventListener("change", render);
  document.getElementById("search-box").addEventListener("input", render);
  document.addEventListener("click", () => closeAllPanels());

  render();
}

init();
</script>
</body>
</html>
