<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My GitHub Tasks</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e5;
    --accent: #2563eb;
    --chip-bg: #eef2ff;
    --chip-muted-bg: #eceef1;
    --chip-muted-text: #6b6b6b;
    --chip-done-bg: #e6f4ea;
    --chip-done-text: #1e7d3c;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    --pad-x: clamp(16px, 4vw, 48px);
    --row-overdue-bg: #fdeeee;
    --row-overdue-bg-hover: #fbe1e1;
    --row-soon-bg: #fff8e8;
    --row-soon-bg-hover: #fff0cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --card-bg: #1c1c1f;
      --text: #ececec;
      --muted: #9a9a9a;
      --border: #2e2e33;
      --accent: #6d94ff;
      --chip-bg: #232a44;
      --chip-muted-bg: #2a2a2e;
      --chip-muted-text: #9a9a9a;
      --chip-done-bg: #17301f;
      --chip-done-text: #6fd68f;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      --row-overdue-bg: #3a1416;
      --row-overdue-bg-hover: #4a1a1d;
      --row-soon-bg: #332a0c;
      --row-soon-bg-hover: #423613;
    }
  }
  * { box-sizing: border-box; min-width: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 14px var(--pad-x);
    padding-left: calc(var(--pad-x) + env(safe-area-inset-left));
    padding-right: calc(var(--pad-x) + env(safe-area-inset-right));
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 12px;
  }
  h1 { margin: 0; font-size: 1.25rem; }
  .meta { color: var(--muted); font-size: 0.8rem; }
  .controls {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px var(--pad-x);
    padding-left: calc(var(--pad-x) + env(safe-area-inset-left));
    padding-right: calc(var(--pad-x) + env(safe-area-inset-right));
    align-items: stretch;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  select, input[type="text"] {
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.9rem;
  }
  select:focus-visible, input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  #search-box { flex: 1 1 200px; min-width: 140px; }
  .multiselect { position: relative; flex: 0 1 auto; }
  .ms-button {
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    width: 100%;
    min-width: 150px;
    text-align: left;
    white-space: nowrap;
  }
  .ms-button:hover { border-color: var(--accent); }
  .ms-panel {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 40;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    width: max(240px, 100%);
    max-width: min(320px, calc(100vw - 32px));
    max-height: 320px;
    overflow-y: auto;
    padding: 8px;
  }
  .ms-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--card-bg);
  }
  .ms-actions button {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 0.8rem;
    padding: 4px 6px;
  }
  .ms-actions button:hover { text-decoration: underline; }
  .ms-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    font-size: 0.85rem;
    cursor: pointer;
    border-radius: 4px;
  }
  .ms-option:hover { background: var(--chip-bg); }
  .ms-option input { cursor: pointer; width: 16px; height: 16px; flex: none; }
  main {
    padding: 20px var(--pad-x) calc(48px + env(safe-area-inset-bottom));
    padding-left: calc(var(--pad-x) + env(safe-area-inset-left));
    padding-right: calc(var(--pad-x) + env(safe-area-inset-right));
    max-width: 1200px;
    margin: 0 auto;
  }
  .org-block { margin-bottom: 28px; }
  .org-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 8px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--border);
  }
  .project-block { margin: 16px 0 0; }
  .project-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 6px;
  }
  table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 0.88rem;
  }
  th, td {
    text-align: left;
    vertical-align: top;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    overflow-wrap: anywhere;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: color-mix(in srgb, var(--chip-bg) 45%, transparent); }
  th { color: var(--muted); font-weight: 500; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.02em; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .status-chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--accent);
    font-size: 0.76rem;
    white-space: nowrap;
  }
  .status-chip.muted { background: var(--chip-muted-bg); color: var(--chip-muted-text); }
  .status-chip.done { background: var(--chip-done-bg); color: var(--chip-done-text); }
  .deadline-flag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 600;
    white-space: nowrap;
  }
  .deadline-flag.overdue { color: #c0362f; }
  .deadline-flag.soon { color: #8a5a00; }
  @media (prefers-color-scheme: dark) {
    .deadline-flag.overdue { color: #ff9d97; }
    .deadline-flag.soon { color: #ffcf5c; }
  }
  tbody tr.row-overdue { background: var(--row-overdue-bg); }
  tbody tr.row-overdue:hover { background: var(--row-overdue-bg-hover); }
  tbody tr.row-soon { background: var(--row-soon-bg); }
  tbody tr.row-soon:hover { background: var(--row-soon-bg-hover); }
  .overdue-summary {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    margin-bottom: 20px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--row-overdue-bg);
    border: 1px solid #c0362f33;
  }
  .overdue-summary-label { font-weight: 700; font-size: 0.85rem; color: #c0362f; }
  .overdue-summary-person {
    font-size: 0.82rem;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--card-bg);
    border: 1px solid var(--border);
  }
  @media (prefers-color-scheme: dark) {
    .overdue-summary { border-color: #ff9d9733; }
    .overdue-summary-label { color: #ff9d97; }
  }
  .empty { color: var(--muted); padding: 40px 16px; text-align: center; }
  .overflow-wrap { overflow-x: auto; border-radius: 10px; }

  /* Card layout on narrow screens */
  @media (max-width: 720px) {
    header { flex-direction: column; align-items: flex-start; gap: 2px; padding-top: 10px; padding-bottom: 10px; }
    h1 { font-size: 1.05rem; }
    .controls { padding-top: 10px; padding-bottom: 10px; gap: 8px; }

    /* Stack every filter full-width: half-width pairs made dropdown panels
       (anchored left:0 to their own button) overflow past the viewport edge
       for the right-hand control, and shrank tap targets below 44px. */
    .multiselect, select#state-select, #search-box { flex: 1 1 100%; }
    .ms-button, select, input[type="text"] { min-width: 0; min-height: 44px; }
    .ms-panel { max-height: min(320px, 60vh); }
    .ms-option { padding: 10px 6px; font-size: 0.9rem; }
    .ms-option input { width: 18px; height: 18px; }

    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    .overflow-wrap { overflow-x: visible; }
    table { border-radius: 0; border: none; background: none; }
    tbody tr {
      margin-bottom: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    tbody tr:hover { background: var(--card-bg); }
    td {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 8px 12px;
    }
    td::before {
      content: attr(data-label);
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
  }
</style>
</head>
<body>
<header>
  <h1>My GitHub Tasks</h1>
  <div class="meta" id="meta">Loading...</div>
</header>
<div class="controls">
  <div class="multiselect" id="assignee-ms">
    <button type="button" class="ms-button" id="assignee-ms-btn">Assignee: All</button>
    <div class="ms-panel" id="assignee-ms-panel" hidden>
      <div class="ms-actions">
        <button type="button" data-action="all">全選</button>
        <button type="button" data-action="none">全不選</button>
      </div>
      <div class="ms-options" id="assignee-ms-options"></div>
    </div>
  </div>

  <div class="multiselect" id="status-ms">
    <button type="button" class="ms-button" id="status-ms-btn">Status: All</button>
    <div class="ms-panel" id="status-ms-panel" hidden>
      <div class="ms-actions">
        <button type="button" data-action="all">全選</button>
        <button type="button" data-action="none">全不選</button>
      </div>
      <div class="ms-options" id="status-ms-options"></div>
    </div>
  </div>

  <label for="state-select">State:</label>
  <select id="state-select">
    <option value="ALL">All</option>
    <option value="OPEN" selected>Open</option>
    <option value="CLOSED">Closed</option>
  </select>
  <input type="text" id="search-box" placeholder="Filter by title / repo..." />
</div>
<main id="main">
  <div class="empty">Loading data.json...</div>
</main>

<script>
let DATA = null;
let selectedLogins = new Set();
let selectedStatuses = new Set();
let openPanels = [];

const NO_STATUS_LABEL = "(no status)";

const STATUS_LIST = [
  "PARKING LOT",
  "BACKLOG",
  "需求確認中",
  "READY FOR RD",
  "RD處理中",
  "待部署DEV",
  "DEV待測試",
  "DEV測試中",
  "DEV測試完成",
  "待上SIT",
  "SIT待測試",
  "SIT測試中",
  "SIT測試完成",
  "待部署UAT",
  "待上UAT",
  "UAT待測試",
  "UAT測試中",
  "UAT QA測試中",
  "UAT測試完成",
  "UAT QA測試完成",
  "客戶測試中",
  "UAT 客戶測試中",
  "待佈署PROD",
  "待上PROD",
  "已上PROD",
  "PREPROD測試中",
  "PROD測試中",
  "DONE",
  "CANCELLED",
  // Unilever #5 (dev worklist) 專用流程
  "未開始",
  "開發中",
  "可進測試",
  "卡住",
  // Unilever #4 (spec tickets) 專用流程
  "待提問",
  "討論中",
  "待補充",
  "已決議",
  "已落規格",
  "作廢",
];

const DEFAULT_UNCHECKED_STATUSES = new Set([
  "PARKING LOT",
  "BACKLOG",
  "DONE",
  "CANCELLED",
  "已落規格",
  "作廢",
]);

function normalizeStatusKey(s) {
  const trimmed = (s || "").trim();
  return /^[A-Za-z ]+$/.test(trimmed) ? trimmed.toUpperCase() : trimmed;
}

function closeAllPanels() {
  for (const p of openPanels) p.hidden = true;
}

function setupMultiSelect({ btnId, panelId, optionsId, items, selected, label }) {
  const btn = document.getElementById(btnId);
  const panel = document.getElementById(panelId);
  const optionsEl = document.getElementById(optionsId);

  function updateButtonLabel() {
    if (items.length === 0) {
      btn.textContent = `${label}: (none)`;
    } else if (selected.size === items.length) {
      btn.textContent = `${label}: All`;
    } else if (selected.size === 0) {
      btn.textContent = `${label}: None`;
    } else {
      btn.textContent = `${label}: ${selected.size}/${items.length}`;
    }
  }

  optionsEl.innerHTML = "";
  for (const item of items) {
    const optLabel = document.createElement("label");
    optLabel.className = "ms-option";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selected.has(item.key);
    cb.addEventListener("change", () => {
      if (cb.checked) selected.add(item.key);
      else selected.delete(item.key);
      updateButtonLabel();
      render();
    });
    const span = document.createElement("span");
    span.textContent = item.label;
    optLabel.appendChild(cb);
    optLabel.appendChild(span);
    optionsEl.appendChild(optLabel);
  }

  panel.querySelector('[data-action="all"]').addEventListener("click", () => {
    selected.clear();
    for (const item of items) selected.add(item.key);
    for (const cb of optionsEl.querySelectorAll("input")) cb.checked = true;
    updateButtonLabel();
    render();
  });
  panel.querySelector('[data-action="none"]').addEventListener("click", () => {
    selected.clear();
    for (const cb of optionsEl.querySelectorAll("input")) cb.checked = false;
    updateButtonLabel();
    render();
  });

  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isHidden = panel.hidden;
    closeAllPanels();
    panel.hidden = !isHidden;
  });
  panel.addEventListener("click", (e) => e.stopPropagation());

  updateButtonLabel();
  openPanels.push(panel);
}

function groupByOrgProject(items) {
  const orgs = new Map();
  for (const item of items) {
    const orgKey = item.org || "(unknown org)";
    if (!orgs.has(orgKey)) orgs.set(orgKey, new Map());
    const projMap = orgs.get(orgKey);
    const projKey = item.project || "(no project)";
    if (!projMap.has(projKey)) projMap.set(projKey, { url: item.projectUrl, items: [] });
    projMap.get(projKey).items.push(item);
  }
  return orgs;
}

function getFilteredItems() {
  const stateFilter = document.getElementById("state-select").value;
  const search = document.getElementById("search-box").value.trim().toLowerCase();

  let items = [];
  for (const user of DATA.users) {
    if (!selectedLogins.has(user.login)) continue;
    for (const item of user.items || []) {
      items.push({ ...item, assigneeLogin: user.login, assigneeName: user.name });
    }
  }

  if (stateFilter !== "ALL") items = items.filter((i) => i.state === stateFilter);

  items = items.filter((i) =>
    selectedStatuses.has(i.status ? normalizeStatusKey(i.status) : NO_STATUS_LABEL)
  );

  if (search) {
    items = items.filter(
      (i) =>
        i.title.toLowerCase().includes(search) ||
        (i.repo || "").toLowerCase().includes(search)
    );
  }

  return items;
}

function render() {
  const main = document.getElementById("main");
  main.innerHTML = "";

  if (selectedLogins.size === 0) {
    main.innerHTML = '<div class="empty">請至少選擇一位 Assignee。</div>';
    return;
  }
  if (selectedStatuses.size === 0) {
    main.innerHTML = '<div class="empty">請至少選擇一個 Status。</div>';
    return;
  }

  const items = getFilteredItems();

  if (items.length === 0) {
    main.innerHTML = '<div class="empty">沒有符合條件的任務。</div>';
    return;
  }

  const overdueSummary = buildOverdueSummary(items);
  if (overdueSummary) main.appendChild(overdueSummary);

  const orgs = groupByOrgProject(items);
  const sortedOrgs = Array.from(orgs.keys()).sort();

  for (const orgKey of sortedOrgs) {
    const orgBlock = document.createElement("div");
    orgBlock.className = "org-block";
    const orgTitle = document.createElement("div");
    orgTitle.className = "org-title";
    orgTitle.textContent = orgKey;
    orgBlock.appendChild(orgTitle);

    const projMap = orgs.get(orgKey);
    const sortedProjects = Array.from(projMap.keys()).sort();
    for (const projKey of sortedProjects) {
      const proj = projMap.get(projKey);
      const projBlock = document.createElement("div");
      projBlock.className = "project-block";
      const projTitle = document.createElement("div");
      projTitle.className = "project-title";
      if (proj.url) {
        const a = document.createElement("a");
        a.href = proj.url;
        a.target = "_blank";
        a.textContent = projKey;
        projTitle.appendChild(a);
      } else {
        projTitle.textContent = projKey;
      }
      projBlock.appendChild(projTitle);

      const wrap = document.createElement("div");
      wrap.className = "overflow-wrap";
      const table = document.createElement("table");
      table.innerHTML = `
        <colgroup>
          <col style="width:6%"><col style="width:30%"><col style="width:12%">
          <col style="width:16%"><col style="width:8%"><col style="width:15%"><col style="width:13%">
        </colgroup>
        <thead><tr><th>#</th><th>Title</th><th>Repo</th><th>Assignee</th><th>State</th><th>Status</th><th>Deadline</th></tr></thead>
      `;
      const tbody = document.createElement("tbody");
      const sortedItems = proj.items.sort(
        (a, b) =>
          (a.deadline || "9999-99-99").localeCompare(b.deadline || "9999-99-99") ||
          a.assigneeLogin.localeCompare(b.assigneeLogin) ||
          a.number - b.number
      );
      for (const item of sortedItems) {
        const assigneeLabel = item.assigneeName
          ? `${item.assigneeName} (${item.assigneeLogin})`
          : item.assigneeLogin;
        const tr = document.createElement("tr");
        const dCls = deadlineClass(item);
        if (dCls) tr.className = `row-${dCls}`;
        tr.innerHTML = `
          <td data-label="#">#${item.number}</td>
          <td data-label="Title"><a href="${item.url}" target="_blank">${escapeHtml(item.title)}</a></td>
          <td data-label="Repo">${escapeHtml(item.repo || "")}</td>
          <td data-label="Assignee">${escapeHtml(assigneeLabel)}</td>
          <td data-label="State">${item.state}</td>
          <td data-label="Status">${item.status ? `<span class="status-chip ${statusChipClass(item.status)}">${escapeHtml(item.status)}</span>` : ""}</td>
          <td data-label="Deadline">${renderDeadline(item)}</td>
        `;
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      wrap.appendChild(table);
      projBlock.appendChild(wrap);
      orgBlock.appendChild(projBlock);
    }
    main.appendChild(orgBlock);
  }
}

const DONE_STATUS_KEYWORDS = ["DONE", "已上PROD", "已決議"];
const MUTED_STATUS_KEYWORDS = ["PARKING LOT", "BACKLOG", "CANCELLED", "作廢", "未開始", "卡住"];

function statusChipClass(status) {
  const key = normalizeStatusKey(status);
  if (DONE_STATUS_KEYWORDS.includes(key)) return "done";
  if (MUTED_STATUS_KEYWORDS.includes(key)) return "muted";
  return "";
}

const DUE_SOON_DAYS = 3;

function daysUntil(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const target = Date.UTC(y, m - 1, d);
  const now = new Date();
  const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / 86400000);
}

// Returns "overdue" | "soon" | null. Closed/cancelled items never flag.
function deadlineClass(item) {
  if (!item.deadline || item.state !== "OPEN") return null;
  const days = daysUntil(item.deadline);
  if (days < 0) return "overdue";
  if (days <= DUE_SOON_DAYS) return "soon";
  return null;
}

function renderDeadline(item) {
  if (!item.deadline) return "";
  const cls = deadlineClass(item);
  if (cls === "overdue") return `<span class="deadline-flag overdue">${escapeHtml(item.deadline)}</span>`;
  if (cls === "soon") return `<span class="deadline-flag soon">${escapeHtml(item.deadline)}</span>`;
  return escapeHtml(item.deadline);
}

// Builds a banner listing every assignee with at least one overdue item
// among the currently filtered items. Returns null when nobody is overdue.
function buildOverdueSummary(items) {
  const overdueByLogin = new Map(); // login -> { name, count }
  for (const item of items) {
    if (deadlineClass(item) !== "overdue") continue;
    if (!overdueByLogin.has(item.assigneeLogin)) {
      overdueByLogin.set(item.assigneeLogin, { name: item.assigneeName, count: 0 });
    }
    overdueByLogin.get(item.assigneeLogin).count++;
  }
  if (overdueByLogin.size === 0) return null;

  const box = document.createElement("div");
  box.className = "overdue-summary";

  const label = document.createElement("span");
  label.className = "overdue-summary-label";
  label.textContent = "超時：";
  box.appendChild(label);

  const sortedLogins = Array.from(overdueByLogin.keys()).sort();
  for (const login of sortedLogins) {
    const { name, count } = overdueByLogin.get(login);
    const person = document.createElement("span");
    person.className = "overdue-summary-person";
    const label2 = name ? `${name} (${login})` : login;
    person.textContent = count > 1 ? `${label2} ×${count}` : label2;
    box.appendChild(person);
  }
  return box;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

async function init() {
  try {
    const res = await fetch("data.json", { cache: "no-store" });
    DATA = await res.json();
  } catch (e) {
    document.getElementById("main").innerHTML =
      '<div class="empty">無法載入 data.json，請確認排程是否已成功執行一次。</div>';
    return;
  }

  document.getElementById("meta").textContent =
    `Last updated: ${new Date(DATA.generatedAt).toLocaleString()} · ${DATA.orgs.length} orgs · ${DATA.users.length} people`;

  if (!DATA.users || DATA.users.length === 0) {
    document.getElementById("main").innerHTML =
      '<div class="empty">尚無資料，排程執行後會自動出現。</div>';
    return;
  }

  const sortedUsers = [...DATA.users].sort((a, b) => a.login.localeCompare(b.login));
  selectedLogins = new Set(sortedUsers.map((u) => u.login));

  let hasNoStatus = false;
  for (const u of DATA.users) {
    for (const item of u.items || []) {
      if (!item.status) hasNoStatus = true;
    }
  }
  const statusItems = STATUS_LIST.map((s) => ({ key: normalizeStatusKey(s), label: s }));
  if (hasNoStatus) statusItems.push({ key: NO_STATUS_LABEL, label: NO_STATUS_LABEL });

  selectedStatuses = new Set(
    statusItems
      .filter((s) => !DEFAULT_UNCHECKED_STATUSES.has(s.key))
      .map((s) => s.key)
  );

  setupMultiSelect({
    btnId: "assignee-ms-btn",
    panelId: "assignee-ms-panel",
    optionsId: "assignee-ms-options",
    items: sortedUsers.map((u) => ({
      key: u.login,
      label: u.name ? `${u.name} (${u.login})` : u.login,
    })),
    selected: selectedLogins,
    label: "Assignee",
  });

  setupMultiSelect({
    btnId: "status-ms-btn",
    panelId: "status-ms-panel",
    optionsId: "status-ms-options",
    items: statusItems,
    selected: selectedStatuses,
    label: "Status",
  });

  document.getElementById("state-select").addEventListener("change", render);
  document.getElementById("search-box").addEventListener("input", render);
  document.addEventListener("click", () => closeAllPanels());

  render();
}

init();
</script>
</body>
</html>
